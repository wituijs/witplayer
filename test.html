<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test witplayer</title>
</head>
<body>
  <h1>witplayer 测试</h1>
  <div id="player" style="width: 640px; height: 360px; background: #000;"></div>
  
  <script src="./dist/witplayer.js"></script>
  <script>
    console.log('witplayer:', witplayer);
    console.log('typeof witplayer:', typeof witplayer);
    
    if (typeof witplayer === 'function') {
      try {
        const player = new witplayer({
          container: '#player',
          src: 'https://www.w3schools.com/html/mov_bbb.mp4',
          autoplay: false
        });
        console.log('播放器创建成功:', player);
      } catch (e) {
        console.error('创建播放器失败:', e);
      }
    } else {
      console.error('witplayer 不是函数！');
    }
  </script>
</body>
</html>
